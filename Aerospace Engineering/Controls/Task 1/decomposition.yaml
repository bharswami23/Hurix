coordination_pattern: fan-out-synthesize

sub_tasks:

  - id: number_theory_group
    description: >
      Solve prime and arithmetic reasoning problems and produce structured outputs.
    depends_on: []
    parallel_group: math

  - id: optimization_group
    description: >
      Solve optimization and dynamic programming problems.
    depends_on: []
    parallel_group: math

  - id: probability_group
    description: >
      Solve combinatorics and probability problems.
    depends_on: []
    parallel_group: math

  - id: dependency_tasks
    description: >
      Solve synthesis tasks using outputs from upstream problems.
    depends_on:
      - number_theory_group
      - optimization_group
      - probability_group
    parallel_group: synthesize

  - id: final_reducer
    description: >
      Merge all outputs and verify dependency consistency.
    depends_on:
      - dependency_tasks
    parallel_group: reduce
